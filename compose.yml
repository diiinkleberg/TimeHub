services:
  db:
    image: postgres:17.5-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PLANIO_BASE_URL: ${PLANIO_BASE_URL}
      PLANIO_CLIENT_ID: ${PLANIO_CLIENT_ID}
      PLANIO_CLIENT_SECRET: ${PLANIO_CLIENT_SECRET}
      PLANIO_SCOPES: ${PLANIO_SCOPES}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME}
      NUXT_PUBLIC_PLANIO_BASE_URL: ${PLANIO_BASE_URL}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks: [app-network]

volumes:
  postgres_data:

networks:
  app-network: